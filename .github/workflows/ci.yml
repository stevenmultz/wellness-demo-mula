name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Unit/API/UI Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Vitest Unit, Security, API & UI Suite (with Coverage Thresholds)
        run: npm run test:coverage

      - name: Legacy security & audit pure scripts
        run: |
          npx tsx scripts/test-security-remediation.ts
          npx tsx scripts/test-audit-unit.ts
          npx tsx scripts/test-hardening.ts

      - name: Production build check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wellness_ci_placeholder
          JWT_SECRET: ci-placeholder-jwt-secret-minimum-32-characters-long
        run: npm run build

  database-integrity:
    name: Real PostgreSQL Migrations, Seed & Concurrency Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: wellness_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/wellness_ci_test
      DIRECT_URL: postgresql://postgres:postgres_ci_password@localhost:5432/wellness_ci_test
      TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/wellness_ci_test
      JWT_SECRET: ci-placeholder-jwt-secret-minimum-32-characters-long
      SUPERADMIN_EMAIL: superadmin@wellness.test
      SUPERADMIN_PASSWORD: SuperAdmin123!
      APP_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all SQL migrations from scratch (prisma migrate deploy)
        run: npx prisma migrate deploy

      - name: Seed database and verify idempotency (run twice)
        run: |
          npm run db:seed
          npm run db:seed

      - name: Quota row-lock concurrency test (12 concurrent contenders vs 3 seats)
        run: npx tsx scripts/test-quota-concurrency.ts

      - name: Real-DB Auth & Enrollment integration flow
        run: npm run test:integration

      - name: Install Playwright Chromium & build app for E2E
        run: |
          npx playwright install --with-deps chromium
          npm run build

      - name: Run Playwright E2E Browser Suite (Desktop + Mobile PWA + Authenticated Flows)
        env:
          E2E_REQUIRE_DB: "true"
        run: npm run test:e2e
