<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>+ BMS • Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .offline-card {
      max-width: 420px;
      padding: 32px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .bms-logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 24px;
    }
    .bms-plus {
      font-weight: 300;
      font-size: 16px;
      line-height: 1;
      color: #ffffff;
    }
    .bms-text {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #ffffff;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
      color: #f4f4f5;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #a1a1aa;
      margin-bottom: 28px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .retry-btn:hover {
      opacity: 0.9;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="bms-logo">
      <span class="bms-plus">+</span>
      <span class="bms-text">BMS</span>
    </div>
    <h1>You are currently offline</h1>
    <p>Please check your internet connection to access the sanctuary curriculum, log daily check-ins, or explore upcoming cohort schedules.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
